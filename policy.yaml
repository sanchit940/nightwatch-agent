# NightWatch policy. Owned by humans. The agent cannot read or change this file through any tool.
# Targets use the form <connector>:<path>, matched with shell-style wildcards.
version: 1

scope:
  # Targets the agent may read or test (risk 0 and 1).
  read_targets:
    - "docker:container/*"
    - "docker:network/*"
    - "linux:nw-*"
    - "linux:nightwatch-control-plane"
    - "net:*"
    - "k8s:shop/*"
    - "k8s:_cluster/*"
    - "k8s:kube-system/*"
    - "prometheus"
  # Targets the agent may propose changes for (risk 2). Stricter than read scope.
  action_targets:
    - "docker:container/nw-*"
    - "docker:network/nw-*"
    - "k8s:shop/deployments/*"
  # Never touch these, even to read. Deny wins over allow.
  deny_targets:
    - "k8s:*/secrets/*"                  # a named secret: only the list (metadata) is readable

limits:
  max_tool_calls: 40              # per investigation
  max_wall_seconds: 900           # per investigation
  max_risk_without_approval: 1    # risk 0 (read) and 1 (bounded tests) run without approval
  block_risk_at_or_above: 3       # risk 3 (destructive) is blocked in v1
  approval_ttl_seconds: 900       # an approval expires after 15 minutes

actions:
  allowed:
    - restart_container
    - start_container
    - connect_network
    - rollout_undo
    - rollout_restart
    - scale_deployment

# Fix compatibility (owned by humans): actions that cannot remove a cause of this category.
# A restart, start or rollout-restart does not change configuration, environment, image or limits.
fix_compatibility:
  restart_container: &keeps_config [config_error, proxy_misconfig, image_pull_failure, probe_misconfig, scheduling_failure, certificate_error, permission_error]
  start_container: *keeps_config
  rollout_restart: *keeps_config

# Standing approvals written by a human for unattended operation (night mode).
# Each rule is bounded by action, target pattern and rate. All disabled by default:
# with no enabled rule, every change waits for a human.
auto_approve:
  - name: night-restart-redis
    enabled: false
    action: start_container
    targets: ["docker:container/nw-redis"]
    max_per_hour: 2

# Severity levels (owned by humans). The agent assigns one level per incident with these definitions.
severity:
  P0:
    definition: "The public entry point is down, or all requests fail, or data can be lost now."
    approval_ttl_seconds: 900        # 15 minutes: act fast, but a stale approval is still rejected
  P1:
    definition: "Users are affected: some requests fail, latency is high, or a critical dependency is degraded."
    approval_ttl_seconds: 1800
  P2:
    definition: "No user impact now: one component is unhealthy, redundancy is lost, or a limit is near."
    approval_ttl_seconds: 3600

# Slack routing and approvers per severity. Channel names or IDs. Approvers are Slack user IDs (U...).
# An empty approver list means: any member of the channel can decide.
slack:
  # Builder decision 2026-10-11: one channel for all levels for now.
  channels:
    P0: "#nightwatch"
    P1: "#nightwatch"
    P2: "#nightwatch"
  mention:
    P0: "<!channel>"
    P1: "<!here>"
    P2: ""
  # One approval from any listed approver is enough (no two-person rule).
  # Slack member IDs (Profile -> ... -> Copy member ID). Empty = any channel member can decide.
  approvers:
    P0: [U0ARVCKF1UY]
    P1: [U0ARVCKF1UY]
    P2: [U0ARVCKF1UY]
  # When nobody decides in time: remind at half of the time limit, then re-issue the plan and mention these
  # contacts. They can also decide on an escalated plan. Empty list = mention the whole channel.
  escalation:
    remind_at_fraction: 0.5
    max_levels: 2
    contacts:
      P0: [U0ARVCKF1UY]
      P1: [U0ARVCKF1UY]
      P2: [U0ARVCKF1UY]
