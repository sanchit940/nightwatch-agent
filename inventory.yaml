# Trusted infrastructure inventory. Owned by humans. Loaded into the agent prompt as facts about the environment.
environments:
  - name: lab-docker
    platform: docker-compose
    description: Demo shop service on Docker Desktop (Linux VM).
    networks: [nw-front, nw-back]
    services:
      - name: web
        container: nw-web
        role: nginx reverse proxy; public entry point
        endpoint: http://localhost:8080/   # from the agent host
        upstream: http://api:8000          # inside nw-front
      - name: api
        container: nw-api
        role: Python HTTP API; counter stored in Redis
        endpoints: ["http://api:8000/", "http://api:8000/healthz", "http://api:8000/metrics"]
        depends_on: [redis]
        limits: {memory: 256m, cpus: 0.5}
      - name: redis
        container: nw-redis
        role: Redis key-value store
        endpoint: redis:6379               # inside nw-back
      - name: toolbox
        container: nw-toolbox
        role: diagnostics container on both networks; use it as a probe source
      - name: prometheus
        container: nw-prometheus
        role: metrics and alerts for the lab
        endpoint: http://localhost:9090
      - name: grafana
        container: nw-grafana
        role: dashboards and Grafana-managed alerts (tools grafana_*)
        endpoint: http://localhost:3000
      - name: loki
        container: nw-loki
        role: logs of ALL lab containers and of host nw-vm (tool loki_query; labels container, service, host)
        endpoint: http://localhost:3100
      - name: loadgen
        container: nw-loadgen
        role: synthetic traffic to web (about 5 requests/second)
    request_path: "client -> nw-web (nginx :80, host :8080) -> nw-api (:8000) -> nw-redis (:6379)"

  - name: lab-k8s
    platform: kubernetes (kind)
    kube_context: kind-nightwatch
    endpoint: http://localhost:8081/        # NodePort 30080 -> service shop/api, from the agent host
    node_containers: [nightwatch-control-plane]
    namespaces:
      - name: shop
        workloads:
          - {kind: Deployment, name: api, replicas: 2, port: 8000, probes: "readiness+liveness /healthz (checks Redis)", depends_on: [redis], config: configmap/api-config}
          - {kind: Deployment, name: redis, port: 6379}
          - {kind: Deployment, name: toolbox, role: probe source for in-cluster network tests}
        services: [api, redis]

# Servers reached over SSH (key only, known host keys only). Use them as linux targets: host:<name>.
ssh_hosts:
  - name: nw-vm
    role: Linux server with systemd and journald; runs shop-worker.service (a background job)
    address: localhost
    port: 2222
    user: nightwatch
    key_file: lab/vm/keys/id_ed25519
    known_hosts: lab/vm/keys/known_hosts

# CI/CD projects NightWatch may read (and re-run, if policy.yaml allows). Provider: github | gitlab | jenkins.
ci_projects:
  - provider: github
    project: sanchit940/nightwatch-agent
    role: NightWatch's own tests (workflow "tests"); lab fault input inject_failure
  - provider: jenkins
    project: nightwatch-lab-build
    role: lab Jenkins freestyle job (local, port 8090); parameter FAULT
