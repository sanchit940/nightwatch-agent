#    address: 10.0.1.15
#    port: 22
#    user: nightwatch                       # read access to the journal: group systemd-journal
#    key_file: ssh/id_ed25519               # relative to this folder
#    known_hosts: ssh/known_hosts           # ssh-keyscan -t ed25519 10.0.1.15 > ssh/known_hosts, then check the key

# CI projects NightWatch may read. Provider: github | gitlab | jenkins.
ci_projects: []
