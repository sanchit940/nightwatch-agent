# Your infrastructure, as facts for the agent. Owned by humans. It is part of the agent's prompt, and the agent
# trusts it: write only true facts. The causal-chain check uses depends_on to accept "A caused B" claims.
# Empty is allowed: the agent then discovers the resources with its tools.
environments: []
