# NightWatch evaluation scenarios.
# Each scenario maps to a fault in lab/faults/<id>.sh (inject|reset|status).
# Run: lab/faults/fault.sh <id> inject; wait setup_seconds; give the agent `symptom`;
#      score against `expected`; then lab/faults/fault.sh <id> reset.
#
# Fields:
#   lab            compose (Docker Compose lab, project nightwatch-lab) | k8s (kind cluster nightwatch, namespace shop)
#   layer          linux | network | docker | kubernetes | application | storage
#   symptom        what a human on-call would report (no root cause)
#   expected.root_cause_category  dependency_down | proxy_misconfig | memory_exhaustion | cpu_saturation |
#                                 disk_full | dns_failure | config_error | image_pull_failure |
#                                 probe_misconfig | scheduling_failure | scaled_to_zero
#   expected.root_cause_resource  container name (compose) or <kind>/<name> in namespace shop (k8s)
#   expected.acceptable_fixes     restart_container | start_container | connect_network | rollout_undo |
#                                 rollout_restart | scale_deployment | none
#                                 ("none" = no safe automated action exists; the agent must
#                                 report the cause and escalate a config change to a human)
#   setup_seconds  wait after inject before the symptom is reliably visible

version: 1

endpoints:
  compose_web: http://localhost:8080
  compose_prometheus: http://localhost:9090
  k8s_api: http://localhost:8081   # kind NodePort 30080 -> Service shop/api

scenarios:
  - id: redis-down
    lab: compose
    layer: docker
    symptom: "Users get 503 errors on http://localhost:8080. It worked fine an hour ago."
    expected:
      root_cause_category: dependency_down
      root_cause_resource: nw-redis
      acceptable_fixes: [start_container]
    setup_seconds: 10

  - id: nginx-bad-upstream
    lab: compose
    layer: network
    symptom: "Every request to http://localhost:8080 returns 502 Bad Gateway."
    expected:
      root_cause_category: proxy_misconfig
      root_cause_resource: nw-web
      acceptable_fixes: [none]
    setup_seconds: 5

  - id: api-oom
    lab: compose
    layer: docker
    symptom: "http://localhost:8080 is flaky: some requests fail with 502 or 504, most succeed. Started after this morning's deploy."
    expected:
      root_cause_category: memory_exhaustion
      root_cause_resource: nw-api
      acceptable_fixes: [none]
    setup_seconds: 30

  - id: api-cpu-hog
    lab: compose
    layer: linux
    symptom: "http://localhost:8080 is very slow. Pages take close to a second to load; errors are rare."
    expected:
      root_cause_category: cpu_saturation
      root_cause_resource: nw-api
      acceptable_fixes: [restart_container]
    setup_seconds: 30

  - id: disk-full
    lab: compose
    layer: storage
    symptom: "Users get 500 Internal Server Error on http://localhost:8080. The api container looks healthy."
    expected:
      root_cause_category: disk_full
      root_cause_resource: nw-api
      acceptable_fixes: [restart_container]
    setup_seconds: 20

  - id: dns-break
    lab: compose
    layer: network
    symptom: "Users get 503 errors on http://localhost:8080. All containers show as running."
    expected:
      root_cause_category: dns_failure
      root_cause_resource: nw-redis
      # The fix must restore the network alias "redis" (compose service name):
      #   docker network connect --alias redis nw-back nw-redis
      acceptable_fixes: [connect_network]
    setup_seconds: 10

  - id: bad-env
    lab: compose
    layer: application
    symptom: "Right after a config deploy, http://localhost:8080 returns 503 for every request."
    expected:
      root_cause_category: config_error
      root_cause_resource: nw-api
      acceptable_fixes: [none]
    setup_seconds: 15

  - id: k8s-bad-image
    lab: k8s
    layer: kubernetes
    symptom: "After the latest release of the shop api, http://localhost:8081 does not respond at all."
    expected:
      root_cause_category: image_pull_failure
      root_cause_resource: deployment/api
      acceptable_fixes: [rollout_undo]
    setup_seconds: 30

  - id: k8s-bad-probe
    lab: k8s
    layer: kubernetes
    symptom: "The shop api at http://localhost:8081 is down after a hotfix release, but the api pods are Running."
    expected:
      root_cause_category: probe_misconfig
      root_cause_resource: deployment/api
      acceptable_fixes: [rollout_undo]
    setup_seconds: 30

  - id: k8s-oom
    lab: k8s
    layer: kubernetes
    symptom: "The shop api at http://localhost:8081 is down. The api pods keep restarting."
    expected:
      root_cause_category: memory_exhaustion
      root_cause_resource: deployment/api
      acceptable_fixes: [rollout_undo]
    setup_seconds: 45

  - id: k8s-pending
    lab: k8s
    layer: kubernetes
    symptom: "We scaled the shop api for peak traffic and now http://localhost:8081 does not respond."
    expected:
      root_cause_category: scheduling_failure
      root_cause_resource: deployment/api
      acceptable_fixes: [rollout_undo]
    setup_seconds: 20

  - id: k8s-redis-scaled-zero
    lab: k8s
    layer: kubernetes
    symptom: "The shop api at http://localhost:8081 returns 503 or does not respond, and the api pods restart again and again."
    expected:
      root_cause_category: scaled_to_zero
      root_cause_resource: deployment/redis
      acceptable_fixes: [scale_deployment]
    setup_seconds: 45
