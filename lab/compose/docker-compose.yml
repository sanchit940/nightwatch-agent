name: nightwatch-lab

services:
  web:
    image: nginx:1.27-alpine
    container_name: nw-web
    ports:
      - "8080:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - front
    restart: unless-stopped

  api:
    build:
      context: ./api
    image: nightwatch-api:lab
    container_name: nw-api
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      DATA_DIR: /data
    tmpfs:
      - /data:size=64m,mode=1777
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - front
      - back
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: nw-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - back
    restart: unless-stopped

  toolbox:
    image: python:3.12-alpine
    container_name: nw-toolbox
    command: ["sleep", "infinity"]
    init: true
    networks:
      - front
      - back
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: nw-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    networks:
      - front
    restart: unless-stopped

  loadgen:
    image: alpine:3.20
    container_name: nw-loadgen
    command: ["/bin/sh", "/loadgen.sh"]
    init: true
    environment:
      TARGET: http://web/
    volumes:
      - ./loadgen/loadgen.sh:/loadgen.sh:ro
    networks:
      - front
    restart: unless-stopped

  loki:
    image: grafana/loki:3.4.2
    container_name: nw-loki
    command: ["-config.file=/etc/loki/config.yml"]
    environment:
      GOMEMLIMIT: 150MiB
    ports:
      - "3100:3100"
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    mem_limit: 200m
    memswap_limit: 200m
    networks:
      - front
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.4.2
    container_name: nw-promtail
    command: ["-config.file=/etc/promtail/config.yml"]
    environment:
      GOMEMLIMIT: 75MiB
    volumes:
      - ./promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - vm-journal:/var/log/journal:ro
      - promtail-data:/var/lib/promtail
    mem_limit: 100m
    memswap_limit: 100m
    depends_on:
      - loki
    networks:
      - front
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:11.5.2
    container_name: nw-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-nightwatch-lab}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_BASIC_ENABLED: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_LOG_LEVEL: warn
      GOMEMLIMIT: 160MiB
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    mem_limit: 200m
    memswap_limit: 200m
    depends_on:
      - prometheus
      - loki
    networks:
      - front
    restart: unless-stopped

  # Small Linux host with systemd (PID 1), journald and sshd. SSH keys: lab/vm/keys.sh.
  vm:
    build:
      context: ../vm
    image: nightwatch-vm:lab
    container_name: nw-vm
    hostname: nw-vm
    privileged: true
    cgroup: private
    stop_signal: SIGRTMIN+3
    tmpfs:
      - /run
      - /run/lock
      - /tmp
      - /var/lib/shop-worker:size=32m,mode=0755
    volumes:
      - vm-journal:/var/log/journal
      - ../vm/keys/id_ed25519.pub:/opt/provision/authorized_keys:ro
      - ../vm/keys/ssh_host_ed25519_key:/opt/provision/ssh_host_ed25519_key:ro
    ports:
      - "2222:22"
    mem_limit: 200m
    memswap_limit: 200m
    networks:
      - front
    restart: unless-stopped

networks:
  front:
    name: nw-front
  back:
    name: nw-back

volumes:
  loki-data:
  promtail-data:
  vm-journal:
