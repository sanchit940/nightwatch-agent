log_format upstreamlog '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                       'rt=$request_time upstream=$upstream_addr '
                       'upstream_status=$upstream_status upstream_rt=$upstream_response_time';

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log upstreamlog;

    # Docker embedded DNS. Re-resolve "api" so a recreated container is found.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    location = /nginx_status {
        stub_status;
        access_log off;
    }

    location / {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
    }
}
