groups:
  - name: api
    rules:
      - alert: ApiDown
        expr: up{job="api"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "API target {{ $labels.instance }} is down"
          description: "Prometheus cannot scrape {{ $labels.instance }} for 30s."

      - alert: ApiHigh5xxRatio
        expr: |
          sum(rate(http_requests_total{job="api",path="/",code=~"5.."}[1m]))
            /
          sum(rate(http_requests_total{job="api",path="/"}[1m])) > 0.05
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "API 5xx ratio is {{ $value | humanizePercentage }}"
          description: "More than 5% of API requests return 5xx."

      - alert: ApiHighLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket{job="api",path="/"}[1m]))) > 0.5
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "API p95 latency is {{ $value | humanizeDuration }}"
          description: "95th percentile latency of GET / is above 500ms."
