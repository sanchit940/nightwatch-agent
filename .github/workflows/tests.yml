name: tests

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: "Test profile"
        type: choice
        options: [standard, tax-v2, extra-deps]
        default: standard

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ "${{ inputs.profile }}" = "extra-deps" ]; then
            pip install "redis-py-cluster-client==9.9.9"
          fi
          pip install -e ".[dev]"
      - name: Test
        env:
          SHOP_PROFILE: ${{ inputs.profile }}
        run: pytest -q tests
