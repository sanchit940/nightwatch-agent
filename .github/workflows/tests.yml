name: tests

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      inject_failure:
        description: "Lab only: make this run fail on purpose (for NightWatch CI tests)"
        type: choice
        options: [none, failing-test, bad-dependency]
        default: none

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ "${{ inputs.inject_failure }}" = "bad-dependency" ]; then
            pip install "redis-py-cluster-client==9.9.9"
          fi
          pip install -e ".[dev]"
      - name: Test
        env:
          NIGHTWATCH_CI_FAULT: ${{ inputs.inject_failure }}
        run: pytest -q tests
