# Create the app: https://api.slack.com/apps -> Create New App -> From a manifest -> paste this file.
display_information:
  name: NightWatch
  description: AI on-call agent. Investigates incidents and asks before it changes anything.
  background_color: "#1d2433"
features:
  bot_user:
    display_name: NightWatch
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write          # post plans and updates
      - chat:write.public   # post to public channels without an invite
settings:
  interactivity:
    is_enabled: true        # Approve / Reject / Suggest another fix buttons
  socket_mode_enabled: true # no public URL needed: the app connects out to Slack
  org_deploy_enabled: false
  token_rotation_enabled: false
